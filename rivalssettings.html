<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rivals Config Editor V5</title>
    <style>
        :root { --neon: #00ff88; --bg: #050505; --card: #12141d; --text: #ffffff; --accent: #1f2335; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 40px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; background: var(--card); padding: 40px; border-radius: 24px; border: 1px solid var(--accent); }
        h1 { color: var(--neon); text-align: center; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 30px; }
        textarea { width: 100%; height: 80px; background: #000; color: var(--neon); border: 2px solid var(--accent); border-radius: 12px; padding: 15px; font-family: monospace; resize: none; box-sizing: border-box; }
        .controls-top { display: flex; gap: 10px; margin: 20px 0; }
        #searchBar { flex-grow: 1; padding: 15px; background: #1a1d2b; border: 1px solid var(--accent); border-radius: 10px; color: white; }
        .btn { background: var(--neon); color: #000; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .section-wrapper { margin-bottom: 10px; opacity: 0; transform: translateY(20px); }
        .section-header { width: 100%; background: var(--accent); color: var(--neon); padding: 15px 20px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .section-content { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1); background: rgba(255,255,255,0.02); border-radius: 0 0 10px 10px; }
        .section-content.open { max-height: 3000px; padding: 20px; }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .setting-card { background: #1a1d2b; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2d3346; }
        .switch { position: relative; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: var(--neon); }
        input:checked + .slider:before { transform: translateX(24px); }
        .num-input { width: 80px; background: #000; border: 1px solid #333; color: var(--neon); padding: 8px; border-radius: 6px; text-align: center; }
        .color-picker { width: 40px; height: 40px; border: none; background: none; cursor: pointer; }
        .animate-load { animation: sweepUp 0.6s forwards; }
        @keyframes sweepUp { to { opacity: 1; transform: translateY(0); } }
        #outputBox { margin-top: 20px; height: 60px; color: #888; border-style: dashed; }
        #actionArea { display: none; margin-top: 40px; border-top: 1px solid var(--accent); padding-top: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Rivals Config Editor</h1>
    <textarea id="inputBox" placeholder="Paste encoded config here (starts with reverse chars)..."></textarea>
    
    <div class="controls-top">
        <button class="btn" onclick="generateMenu()">Load Config</button>
        <input type="text" id="searchBar" placeholder="Search settings..." oninput="filterSettings()">
    </div>

    <div id="settingsContainer"></div>

    <div id="actionArea">
        <button class="btn" style="background:#fff; color:#000; width:100%;" onclick="updateConfig()">Update & Copy Config</button>
        <div id="status" style="text-align:center; color:var(--neon); margin:15px 0; font-weight:bold;"></div>
        <p style="font-size: 0.8rem; color: #6e7691; margin-bottom: 5px;">Backup Text Box (Copy from here if button fails):</p>
        <textarea id="outputBox" readonly></textarea>
    </div>
</div>

<script>
    const alphabet = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
    let originalData = []; // Stores objects with {rawKey: "#Tag#", val: "true"}

    function shiftValue(text, shift) {
        return text.split('').map(char => {
            const idx = alphabet.indexOf(char);
            return idx === -1 ? char : alphabet[(idx + shift + alphabet.length) % alphabet.length];
        }).join('');
    }

    function generateMenu() {
        let raw = document.getElementById('inputBox').value.trim();
        if(!raw) return;

        // STEP 1: DECRYPT - REVERSE THEN SHIFT -1
        let reversed = raw.split('').reverse().join('');
        let decrypted = shiftValue(reversed, -1);

        // Extract body (remove \\ and ^^)
        let body = decrypted.replace(/^\\\\/, '').replace(/\^\^$/, '');
        let items = body.split('^-');

        originalData = items.map(item => {
            let splitIdx = item.lastIndexOf('-'); // Split at the LAST dash to protect negative numbers
            return {
                rawKey: item.substring(0, splitIdx),
                val: item.substring(splitIdx + 1)
            };
        });

        const container = document.getElementById('settingsContainer');
        container.innerHTML = '';

        const sections = {
            "Movement": ["Jump", "Sprint", "Slide", "Crouch", "Walk"],
            "Combat": ["Aim", "Shoot", "Reload", "Melee", "Utility"],
            "Visuals": ["FOV", "HUD", "Highlight", "Shadows", "Textures", "Flashes", "Crosshair"],
            "Controls": ["Hotkey", "Sensitivity", "Gamepad", "Mouse"],
            "Other": []
        };

        const sectionGrids = {};
        Object.keys(sections).forEach((title, idx) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'section-wrapper';
            wrapper.style.animationDelay = (idx * 0.08) + 's';
            wrapper.classList.add('animate-load');
            wrapper.innerHTML = `<div class="section-header" onclick="toggleSection(this)"><span>${title}</span><span>▼</span></div><div class="section-content"><div class="settings-grid"></div></div>`;
            container.appendChild(wrapper);
            sectionGrids[title] = wrapper.querySelector('.settings-grid');
        });

        originalData.forEach((item, i) => {
            // Visual Cleanup: Remove #, !, and Hotkey prefixes for the label ONLY
            const cleanName = item.rawKey.replace(/#/g, '').replace(/!/g, ' ').replace('Hotkey ', '');
            
            let target = "Other";
            for(let s in sections) {
                if(sections[s].some(k => item.rawKey.includes(k))) { target = s; break; }
            }

            const card = document.createElement('div');
            card.className = 'setting-card';
            card.setAttribute('data-name', cleanName.toLowerCase());

            let control = '';
            if(item.val === 'true' || item.val === 'false') {
                control = `<label class="switch"><input type="checkbox" id="v-${i}" ${item.val === 'true' ? 'checked' : ''}><span class="slider"></span></label>`;
            } else if(item.val.startsWith('$')) {
                control = `<input type="color" class="color-picker" id="v-${i}" value="${item.val.replace('$', '#')}">`;
            } else {
                control = `<input type="text" class="num-input" id="v-${i}" value="${item.val}">`;
            }

            card.innerHTML = `<div class="info"><strong>${cleanName}</strong></div>${control}`;
            sectionGrids[target].appendChild(card);
        });

        document.getElementById('actionArea').style.display = 'block';
    }

    function toggleSection(header) {
        const content = header.nextElementSibling;
        content.classList.toggle('open');
        header.querySelector('span:last-child').innerText = content.classList.contains('open') ? '▲' : '▼';
    }

    function filterSettings() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        document.querySelectorAll('.setting-card').forEach(card => {
            card.style.display = card.getAttribute('data-name').includes(q) ? 'flex' : 'none';
        });
        if(q.length > 1) document.querySelectorAll('.section-content').forEach(s => s.classList.add('open'));
    }

    function updateConfig() {
        const body = originalData.map((item, i) => {
            const input = document.getElementById(`v-${i}`);
            let newVal = input.type === 'checkbox' ? (input.checked ? 'true' : 'false') : (input.type === 'color' ? input.value.replace('#', '$') : input.value);
            return `${item.rawKey}-${newVal}`;
        }).join('^-');

        // PRECISE ENCRYPTION: SHIFT +1 THEN REVERSE
        const fullDecrypted = "\\\\" + body + "^^";
        const shifted = shiftValue(fullDecrypted, 1);
        const final = shifted.split('').reverse().join('');

        document.getElementById('outputBox').value = final;
        navigator.clipboard.writeText(final).then(() => {
            document.getElementById('status').innerText = "COPIED TO CLIPBOARD!";
            setTimeout(() => document.getElementById('status').innerText = "", 3000);
        });
    }
</script>
</body>
</html>
