<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Gamepass Checker</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #eee; max-width: 500px; margin: 40px auto; padding: 0 16px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; box-sizing: border-box; font-size: 16px; }
    input { background: #1e1e1e; color: #fff; }
    button { background: #00b06f; color: #fff; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background: #009960; }
    #result { margin-top: 16px; padding: 14px; border-radius: 6px; display: none; line-height: 1.5; }
    .valid { background: #133929; border: 1px solid #00b06f; }
    .invalid { background: #3b1818; border: 1px solid #ff4d4d; }
  </style>
</head>
<body>
  <h2>Gamepass Validity Checker</h2>
  <input type="text" id="input" placeholder="Paste Gamepass URL or ID..." />
  <button onclick="checkPass()">Check Gamepass</button>
  <div id="result"></div>

  <script>
    async function checkPass() {
      const raw = document.getElementById('input').value.trim();
      const resBox = document.getElementById('result');
      const match = raw.match(/(\d+)/);

      if (!match) {
        showResult(false, "Invalid input. Enter a Gamepass ID or URL.");
        return;
      }

      const passId = match[1];
      resBox.style.display = 'block';
      resBox.className = '';
      resBox.innerHTML = 'Checking...';

      try {
        const target = `https://apis.roblox.com/game-passes/v1/game-passes/${passId}/product-info`;
        const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(target)}`);
        
        if (!response.ok) {
          showResult(false, `❌ <b>Invalid / Not Found</b> (HTTP ${response.status})<br>Check if the ID is a Gamepass and not a Shirt/Place.`);
          return;
        }

        const data = await response.json();
        const isForSale = data.IsForSale === true;
        const price = data.PriceInRobux;

        if (isForSale && price !== null) {
          showResult(true, `
            ✅ <b>VALID & PURCHASABLE</b><br>
            <b>Name:</b> ${data.Name}<br>
            <b>Price:</b> ${price} Robux<br>
            <b>Creator:</b> ${data.Creator?.Name || 'Unknown'}
          `);
        } else {
          showResult(false, `
            ❌ <b>NOT FOR SALE (OFF-SALE)</b><br>
            <b>Name:</b> ${data.Name}<br>
            Tell the user to enable "Item for Sale" and set a price.
          `);
        }
      } catch (err) {
        showResult(false, `⚠️ <b>Network/Proxy Error:</b> ${err.message}`);
      }
    }

    function showResult(isValid, html) {
      const resBox = document.getElementById('result');
      resBox.style.display = 'block';
      resBox.className = isValid ? 'valid' : 'invalid';
      resBox.innerHTML = html;
    }
  </script>
</body>
</html>
